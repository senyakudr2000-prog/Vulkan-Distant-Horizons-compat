name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack source
        run: |
          ZIP=$(find . -name '*.zip' -not -path './src/*' | head -n 1)
          echo "Found: $ZIP"
          [ -z "$ZIP" ] && echo "No zip in repo" && exit 1
          mkdir src
          unzip -q "$ZIP" -d src
          cd src/distant-horizons-vulkanmod-main
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i '/render.glObject.GLProxy/d' vulkan/src/main/java/com/braffolk/dhvulkan/core/VulkanRenderContext.java
          chmod +x gradlew
          ls versionProperties

      - name: Download DH and VulkanMod
        working-directory: src/distant-horizons-vulkanmod-main
        run: |
          mkdir -p jars
          UA="User-Agent: dh-vulkanmod-build"
          URL=$(curl -sG -H "$UA" https://api.modrinth.com/v2/project/distanthorizons/version \
            --data-urlencode 'game_versions=["1.21.11"]' \
            --data-urlencode 'loaders=["fabric"]' \
            | jq -r '[.[] | select(.version_number | contains("3.3.3"))][0].files[0].url')
          [ "$URL" = "null" ] && echo "DH 3.3.3 not found on Modrinth" && exit 1
          curl -sL -H "$UA" -o jars/DistantHorizons-3.3.3-1.21.11-fabric-neoforge.jar "$URL"
          URL=$(curl -sG -H "$UA" https://api.modrinth.com/v2/project/vulkanmod/version \
            --data-urlencode 'game_versions=["1.21.11"]' \
            --data-urlencode 'loaders=["fabric"]' \
            | jq -r '[.[] | select(.version_number | startswith("0.6.1"))][0].files[0].url')
          [ "$URL" = "null" ] && echo "VulkanMod 0.6.1 not found" && exit 1
          curl -sL -H "$UA" -o jars/VulkanMod_1.21.11-0.6.1.jar "$URL"
          ls -la jars

      - name: Build
        working-directory: src/distant-horizons-vulkanmod-main
        run: ./gradlew :vulkan:build -PmcVer=1.21.11 --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dh-vulkanmod
          path: src/distant-horizons-vulkanmod-main/vulkan/build/libs/*.jar
